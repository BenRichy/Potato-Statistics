name: Update Potato Data from Google Sheets

# Run every 4 hours (you can adjust this)
on:
  schedule:
    - cron: '0 */4 * * *'
  # Also allow manual triggering
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
        
    - name: Cache R packages
      uses: actions/cache@v3
      with:
        path: ~/.local/share/renv
        key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
        restore-keys: |
          ${{ runner.os }}-renv-
          
    - name: Install R dependencies
      run: |
        Rscript -e 'install.packages(c("dplyr", "readr", "tidyr", "ggplot2", "ggridges", "viridis", "pheatmap", "tibble", "purrr", "BradleyTerry2", "googlesheets4", "httr"), repos="https://cran.rstudio.com/")'
        
    - name: Run data processing script
      run: |
        Rscript data_analysis.R
        
    - name: Commit and push updated data files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add app/data/*.RData
        git diff --staged --quiet || git commit -m "Auto-update data from Google Sheets $(date)"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}